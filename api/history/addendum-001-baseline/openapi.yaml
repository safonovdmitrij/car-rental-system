openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: REST API системи прокату автомобілів
  version: 0.1.0-draft
  description: >-
    Робоча специфікація на основі api/*.md та spec/srs.md, functional-requirements.md, acceptance-criteria.md, glossary.md,
    bdd-scenarios.md. Контракт не оголошено остаточно погодженим; не засвідчує реалізацію чи тестування. Усі приклади
    демонстраційні: відносні до поточного часу умови перевіряє сервер, дати прикладів не є обмеженням. HTTPS у робочому
    середовищі. Усі відповіді з тілом — application/json; 204 без тіла. Автентифікація й роль перевіряються до існування
    захищеного ресурсу. Для чужого/відсутнього бронювання однаковий 404. Помилки не розкривають паролі/хеші, токени
    сесій, чужі контакти, службові причини, особисті дані адміністратора чи внутрішні технічні деталі; priceConfirmationToken
    дозволений лише у PRICE_CHANGED Quote. Невідомі поля запитів заборонені. Окремі параметри query не виражають
    залежність двох меж: цю залежність CatalogQuery додатково перевіряє сервер. 405 для непідтримуваних методів
    та 404 невідомих URI не створюють додаткових операцій.
x-contract-status: draft-with-open-questions
x-unresolved-questions:
- id: session-lifetime
  description: Строк дії сесії не визначено; expiresAt/refreshToken не додано.
- id: password-session-effects
  description: Наслідки зміни пароля для чинних сесій не визначено.
- id: Q-07
  description: >-
    Як рахувати проміжні календарні добові межі й 90-денний горизонт, якщо обчислений місцевий час не існує або
    повторюється. Правило введених меж і спеціальне правило межі скасування не переносяться автоматично.
servers:
- url: /api/v1
  description: Відносний базовий URI; paths не повторюють префікс. Продуктивний транспорт — HTTPS.
security:
- BearerAuth: []
tags:
- name: Каталог
- name: Обліковий запис
- name: Профіль
- name: Бронювання
- name: Автопарк
- name: Службова недоступність
paths:
  /cars:
    get:
      operationId: listCars
      x-op-id: OP-01
      x-req-ids:
      - REQ-F-001
      - REQ-F-002
      - REQ-F-003
      - REQ-F-004
      - REQ-F-005
      - REQ-F-007
      - REQ-F-008
      - REQ-F-027
      - REQ-F-028
      - REQ-F-029
      - REQ-F-030
      - REQ-F-061
      - REQ-F-068
      - REQ-F-069
      - REQ-F-071
      - REQ-F-087
      - REQ-F-088
      - REQ-F-089
      - REQ-F-092
      tags:
      - Каталог
      summary: Публічний каталог і пошук на весь період; перетини й приховування виключають авто, суміжність і скасовані
        записи не блокують
      description: >-
        Без обов’язкового входу: Г/К — PublicCar, А — AdminCar, лише неприховані авто. Для отримання адміністративних
        полів сервер перевіряє роль Bearer-сесії. Обидві query-межі разом або обидві відсутні; невідомі query-поля
        відхиляються. Без періоду немає твердження про доступність. Сервер перевіряє існування календарної дати,
        однозначність часу Europe/Kyiv і endsAt > startsAt; шаблону LocalHour недостатньо. Для пошуку не застосовуються
        майбутність, 1–30 діб і горизонт 90 днів. Доступність на весь напіввідкритий період [startsAt, endsAt):
        приховане авто, підтверджені/активні бронювання й службові періоди блокують; суміжність дозволена, скасовані
        бронювання не блокують. Читання/розрахунок не резервують авто. Публічна вимога входу відсутня; за наданою
        чинною Bearer-сесією А отримує адміністративну проєкцію.
      security:
      - {}
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/startsAtOptional'
      - $ref: '#/components/parameters/endsAtOptional'
      responses:
        '200':
          $ref: '#/components/responses/Catalog'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '405':
          $ref: '#/components/responses/MethodNotAllowedGetPost'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createCar
      x-op-id: OP-15
      x-req-ids:
      - REQ-F-065
      - REQ-F-087
      - REQ-F-088
      - REQ-F-089
      tags:
      - Автопарк
      summary: Додавання конкретного авто; лише А, з однаковими правами для всіх адміністраторів і перевіркою прямого
        API-запиту
      description: >-
        Лише А, роль перевіряє сервер. Додавання конкретного авто з characteristics та додатним тарифом; hidden
        типово false. Валюту й ідентифікатор визначає сервер.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarCreateRequest'
            examples:
              CarCreateRequest:
                $ref: '#/components/examples/CarCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/CarCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '405':
          $ref: '#/components/responses/MethodNotAllowedGetPost'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cars/{carId}:
    get:
      operationId: getCar
      x-op-id: OP-02
      x-req-ids:
      - REQ-F-001
      - REQ-F-002
      - REQ-F-068
      - REQ-F-069
      - REQ-F-071
      - REQ-F-087
      - REQ-F-088
      - REQ-F-089
      - REQ-F-092
      tags:
      - Каталог
      summary: 'Проєктна деталізація каталогу: характеристики й тариф; приховане авто не розкривається Г/К'
      description: >-
        Без обов’язкового входу. Г/К читають лише неприховане авто; приховане дає NOT_FOUND. А читає також приховане
        й отримує hidden/futureBookingsCount; роль і вибір проєкції перевіряє сервер. Лічильник дозволяє попередити
        перед приховуванням. Публічна вимога входу відсутня; за наданою чинною Bearer-сесією А отримує адміністративну
        проєкцію.
      security:
      - {}
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/carId'
      responses:
        '200':
          $ref: '#/components/responses/Car'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowedGetPatchDelete'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateCar
      x-op-id: OP-16
      x-req-ids:
      - REQ-F-039
      - REQ-F-044
      - REQ-F-066
      - REQ-F-067
      - REQ-F-068
      - REQ-F-069
      - REQ-F-070
      - REQ-F-071
      - REQ-F-087
      - REQ-F-088
      - REQ-F-089
      tags:
      - Автопарк
      summary: А редагує характеристики/тариф, приховує або повертає авто; попереджається про майбутні бронювання
      description: >-
        Лише А; сервер перевіряє роль. Принаймні одне дозволене поле, characteristics повністю замінюється. Зміна
        тарифу не змінює зафіксованих цін бронювань. При приховуванні наявні бронювання зберігаються без скасування;
        якщо є майбутні confirmed, warnings містить FUTURE_BOOKINGS_EXIST з актуальним лічильником, інакше []. Лічильник
        збігається з car.futureBookingsCount; попередження не блокує операцію. Повернення авто зберігає бронювання
        й службові періоди.
      parameters:
      - $ref: '#/components/parameters/carId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarPatch'
            examples:
              CarPatch:
                $ref: '#/components/examples/CarPatch'
              CarDetailsPatch:
                $ref: '#/components/examples/CarDetailsPatch'
              CarRestoreRequest:
                $ref: '#/components/examples/CarRestoreRequest'
      responses:
        '200':
          $ref: '#/components/responses/CarUpdated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '405':
          $ref: '#/components/responses/MethodNotAllowedGetPatchDelete'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteCar
      x-op-id: OP-17
      x-req-ids:
      - REQ-F-072
      - REQ-F-087
      - REQ-F-088
      - REQ-F-089
      tags:
      - Автопарк
      summary: Лише А; фізичне видалення можливе без будь-яких пов’язаних бронювань і службових періодів, включно
        з історичними
      description: >-
        Лише А; сервер перевіряє роль та атомарно відсутність будь-яких пов’язаних бронювань і службових періодів,
        включно зі скасованими/історичними. За їх наявності 409, інакше фізичне видалення.
      parameters:
      - $ref: '#/components/parameters/carId'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CarRelatedRecords'
        '405':
          $ref: '#/components/responses/MethodNotAllowedGetPatchDelete'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /cars/{carId}/availability:
    get:
      operationId: getCarAvailability
      x-op-id: OP-03
      x-req-ids:
      - REQ-F-006
      - REQ-F-007
      - REQ-F-008
      - REQ-F-027
      - REQ-F-028
      - REQ-F-029
      - REQ-F-030
      - REQ-F-061
      - REQ-F-092
      tags:
      - Каталог
      summary: Перевірка конкретного авто; приховування й перетини дають false, суміжність і скасовані бронювання
        не блокують
      description: >-
        Без обов’язкового входу, обидві query-межі обов’язкові; невідомі query-поля відхиляються. Для відомого прихованого
        авто available=false без характеристик/причини. Сервер перевіряє існування календарної дати, однозначність
        часу Europe/Kyiv і endsAt > startsAt; шаблону LocalHour недостатньо. Майбутність, 1–30 діб і горизонт 90
        днів не застосовуються. Доступність на весь напіввідкритий період [startsAt, endsAt): приховане авто, підтверджені/активні
        бронювання й службові періоди блокують; суміжність дозволена, скасовані бронювання не блокують. Читання/розрахунок
        не резервують авто.
      security: []
      parameters:
      - $ref: '#/components/parameters/carId'
      - $ref: '#/components/parameters/startsAtRequired'
      - $ref: '#/components/parameters/endsAtRequired'
      responses:
        '200':
          $ref: '#/components/responses/Availability'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '405':
          $ref: '#/components/responses/MethodNotAllowedGet'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /clients:
    post:
      operationId: registerClient
      x-op-id: OP-04
      x-req-ids:
      - REQ-F-009
      - REQ-F-010
      - REQ-F-011
      - REQ-F-014
      - REQ-F-082
      - REQ-F-089
      tags:
      - Обліковий запис
      summary: Реєстраційні поля, нормалізація й унікальність пошти, довжина нового пароля
      description: >-
        Публічна реєстрація лише клієнта; role не приймається. Сервер обрізає крайні пробіли email перед перевіркою
        формату й порівнює адреси без регістру, перевіряє унікальність. Новий пароль від 8 символів без обрізання.
        201 без Location та автоматичного входу; для входу OP-05.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
            examples:
              RegistrationRequest:
                $ref: '#/components/examples/RegistrationRequest'
      responses:
        '201':
          $ref: '#/components/responses/RegisteredClient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/EmailConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '405':
          $ref: '#/components/responses/MethodNotAllowedPost'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /sessions:
    post:
      operationId: createSession
      x-op-id: OP-05
      x-req-ids:
      - REQ-F-010
      - REQ-F-012
      - REQ-F-013
      - REQ-F-015
      - REQ-F-016
      - REQ-F-017
      - REQ-F-018
      - REQ-F-019
      - REQ-F-020
      tags:
      - Обліковий запис
      summary: >-
        Вхід обох ролей за нормалізованою поштою й паролем; окремі лічильники, блокування на п’ятій помилці, незмінність
        його межі та автоматичне скидання
      description: >-
        Публічний вхід клієнта або адміністратора. Нормалізація email за SRS; пароль без обрізання. Сервер перевіряє
        облікові дані й окремий лічильник запису: п’ята послідовна помилка блокує на 15 хвилин, повторні спроби
        не подовжують межу, успіх або сплив блокування скидає лічильник. INVALID_CREDENTIALS не повідомляє існування
        адреси. Строк сесії та наслідки зміни пароля для сесій невирішені.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              LoginRequest:
                $ref: '#/components/examples/LoginRequest'
              LoginAdminRequest:
                $ref: '#/components/examples/LoginAdminRequest'
      responses:
        '201':
          $ref: '#/components/responses/SessionCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/LoginBlocked'
        '405':
          $ref: '#/components/responses/MethodNotAllowedPost'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /profile:
    get:
      operationId: getOwnProfile
      x-op-id: OP-06
      x-req-ids:
      - REQ-F-021
      - REQ-F-089
      tags:
      - Профіль
      summary: Допоміжне читання власних контактів для редагування й повторного перегляду (AC-F-021-01); клієнт
        визначається чинною сесією
      description: 'Лише К: власний профіль визначається Bearer-сесією, не параметром clientId; А не має права на
        цю операцію.'
      responses:
        '200':
          $ref: '#/components/responses/Profile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowedGetPatch'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateOwnProfile
      x-op-id: OP-07
      x-req-ids:
      - REQ-F-021
      - REQ-F-023
      - REQ-F-024
      - REQ-F-025
      - REQ-F-086
      - REQ-F-089
      tags:
      - Профіль
      summary: Зміна лише власних дозволених контактів, без зміни пошти; контакти в бронюваннях актуалізуються,
        авто/період/ціна не змінюються
      description: >-
        Лише К, власний профіль із сесії. Дозволені лише firstName, lastName, phone; email/role/clientId заборонені.
        Контакти в раніше створених бронюваннях актуальні, їх авто/період/зафіксовані ціни не змінюються. Сервер
        перевіряє права; принаймні одне поле.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilePatch'
            examples:
              ProfilePatch:
                $ref: '#/components/examples/ProfilePatch'
      responses:
        '200':
          $ref: '#/components/responses/ProfileUpdated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '405':
          $ref: '#/components/responses/MethodNotAllowedGetPatch'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /profile/password:
    put:
      operationId: changeOwnPassword
      x-op-id: OP-08
      x-req-ids:
      - REQ-F-014
      - REQ-F-022
      - REQ-F-086
      - REQ-F-089
      tags:
      - Профіль
      summary: Зміна власного пароля після перевірки поточного, новий — від 8 символів; через API неможливо вибрати
        чужий профіль
      description: >-
        Лише К, власний профіль із сесії. Сервер перевіряє currentPassword; невірний — 422 з полем currentPassword
        без значення. Новий пароль від 8 символів; жоден пароль не змінюється й не обрізається. Вплив на чинні сесії
        невирішений; новий токен не видається.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
            examples:
              PasswordChangeRequest:
                $ref: '#/components/examples/PasswordChangeRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '405':
          $ref: '#/components/responses/MethodNotAllowedPut'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
