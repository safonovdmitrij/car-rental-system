          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowedGetPatchDelete'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateServicePeriod
      x-op-id: OP-21
      x-req-ids:
      - REQ-F-074
      - REQ-F-075
      - REQ-F-077
      - REQ-F-078
      - REQ-F-079
      - REQ-F-080
      - REQ-F-081
      - REQ-F-087
      - REQ-F-088
      - REQ-F-089
      - REQ-F-092
      tags:
      - Службова недоступність
      summary: 'Лише А й до чинного початку: підсумковий період має межі та причину й проходить перевірку перетинів
        без скасування бронювань'
      description: >-
        Лише А; роль і належність periodId до carId перевіряє сервер. Принаймні одне поле; підсумковий об’єкт перевіряється
        після PATCH. Сервер перевіряє існування календарної дати, однозначність часу Europe/Kyiv і endsAt > startsAt;
        шаблону LocalHour недостатньо. Створення/підсумковий новий початок редагування — у майбутньому. Чинний період
        редагується/видаляється лише до його початку; після початку історія зберігається. Обмеження оренди 1–30
        діб і 90 днів не застосовуються. Сервер атомарно перевіряє конфлікти, також щодо паралельних бронювань:
        перетини з підтвердженими/активними бронюваннями чи іншими службовими періодами відхиляються без скасування
        бронювань; суміжність дозволена; при редагуванні запис не конфліктує із собою.
      parameters:
      - $ref: '#/components/parameters/carId'
      - $ref: '#/components/parameters/periodId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePeriodPatch'
            examples:
              ServicePeriodPatch:
                $ref: '#/components/examples/ServicePeriodPatch'
      responses:
        '200':
          $ref: '#/components/responses/ServicePeriodUpdated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ServiceUpdateConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '405':
          $ref: '#/components/responses/MethodNotAllowedGetPatchDelete'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteServicePeriod
      x-op-id: OP-22
      x-req-ids:
      - REQ-F-076
      - REQ-F-081
      - REQ-F-087
      - REQ-F-088
      - REQ-F-089
      - REQ-F-092
      tags:
      - Службова недоступність
      summary: Лише А; видалення до початку, збереження історії після початку
      description: >-
        Лише А; сервер перевіряє роль і належність periodId до carId; невідповідність — NOT_FOUND. Видалення строго
        до чинного початку; від початку включно 409 SERVICE_PERIOD_ALREADY_STARTED, історія зберігається. Службова
        причина не розкривається Г/К.
      parameters:
      - $ref: '#/components/parameters/carId'
      - $ref: '#/components/parameters/periodId'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ServiceStarted'
        '405':
          $ref: '#/components/responses/MethodNotAllowedGetPatchDelete'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >-
        Непрозорий accessToken; JWT не вимагається. Ролі й власність перевіряє сервер. Строк дії та відкликання
        при зміні пароля невирішені.
  parameters:
    carId:
      name: carId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: car-example
    bookingId:
      name: bookingId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: booking-example
    periodId:
      name: periodId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      example: period-example
    startsAtOptional:
      name: startsAt
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/LocalHour'
      example: 2026-11-12T09
      description: Місцевий час Europe/Kyiv; сервер перевіряє дату, DST й порядок меж. У OP-01 обидві межі разом
        або обидві відсутні.
    startsAtRequired:
      name: startsAt
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/LocalHour'
      example: 2026-11-12T09
      description: Місцевий час Europe/Kyiv; сервер перевіряє дату, DST й порядок меж. У OP-01 обидві межі разом
        або обидві відсутні.
    endsAtOptional:
      name: endsAt
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/LocalHour'
      example: 2026-11-14T09
      description: Місцевий час Europe/Kyiv; сервер перевіряє дату, DST й порядок меж. У OP-01 обидві межі разом
        або обидві відсутні.
    endsAtRequired:
      name: endsAt
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/LocalHour'
      example: 2026-11-14T09
      description: Місцевий час Europe/Kyiv; сервер перевіряє дату, DST й порядок меж. У OP-01 обидві межі разом
        або обидві відсутні.
  headers:
    WWW-Authenticate:
      description: Обов’язковий для 401 помилки Bearer захищеної операції; не для INVALID_CREDENTIALS у POST /sessions.
      required: true
      schema:
        type: string
        const: Bearer
    Retry-After:
      description: 'Обов’язковий для LOGIN_BLOCKED: додатне ціле секунд до початкової межі блокування, округлення
        вгору. Спроби не подовжують строк.'
      required: true
      schema:
        type: integer
        minimum: 1
      example: 900
    Allow:
      description: 'Обов’язковий для 405: методи з контракту для запитаного URI, через кому; не залежить від ролі.'
      required: true
      schema:
        type: string
        minLength: 1
      example: GET, POST
  schemas:
    Id:
      type: string
      minLength: 1
      description: Непорожній непрозорий ідентифікатор; формат UUID чи числовий формат не вимагається.
    Token:
      type: string
      minLength: 1
      description: Непорожній непрозорий токен. Токен ціни не є токеном сесії.
    NonEmptyString:
      type: string
      minLength: 1
      pattern: \S
      description: Щонайменше один непробільний символ; без обрізання, максимальної довжини чи regex телефону. Не
        застосовується до паролів.
    Email:
      type: string
      format: email
      description: >-
        Сервер спочатку видаляє крайні пробіли, потім перевіряє формат. Зіставлення й унікальність без регістру;
        примусове зниження регістру при збереженні не вимагається.
    NewPassword:
      type: string
      minLength: 8
      writeOnly: true
      description: Новий пароль без зміни та обрізання пробілів; правило NonEmptyString не застосовується.
    LocalHour:
      type: string
      pattern: ^[0-9]{4}-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3])$
      description: >-
        YYYY-MM-DDTHH без зміщення. Схема перевіряє структуру й діапазони компонентів; хвилини/секунди не передаються,
        дорівнюють 00. Сервер додатково перевіряє існування календарної дати й коректність у Europe/Kyiv: неіснуючі
        та неоднозначні введені межі відхиляються. Самого шаблону недостатньо; це також стосується службових періодів.
      examples:
      - 2026-11-12T09
    EventTime:
      type: string
      format: date-time
      not:
        pattern: -00:00$
      description: RFC 3339 з відомим зміщенням UTC; не обмежується цілою годиною.
      examples:
      - '2026-11-11T09:00:00+02:00'
    Timezone:
      type: string
      const: Europe/Kyiv
    Money:
      type: string
      pattern: ^-?[0-9]+\.[0-9]{2}$
      description: Десятковий рядок з двома знаками після крапки, без експоненти. Не JSON number; без довільної
        верхньої межі.
    DailyRate:
      type: string
      pattern: ^[0-9]+\.[0-9]{2}$
      not:
        pattern: ^0+\.00$
      description: Додатний тариф (> 0) у десятковому рядку з двома знаками. Нуль та від’ємні значення заборонені;
        не округлювати мовчки.
      examples:
      - '1500.00'
    Currency:
      type: string
      const: UAH
    BillableDays:
      type: integer
      minimum: 1
      maximum: 30
    FutureBookingsCount:
      type: integer
      minimum: 0
    BookingStatus:
      type: string
      enum:
      - confirmed
      - active
      - completed
      - cancelled
    AccountRole:
      type: string
      enum:
      - client
      - administrator
    Characteristics:
      type: object
      minProperties: 1
      propertyNames:
        $ref: '#/components/schemas/NonEmptyString'
      additionalProperties:
        $ref: '#/components/schemas/NonEmptyString'
      description: Непорожній словник непорожніх назв і значень з непробільним символом. Передавання у PATCH повністю
        замінює словник.
    Profile:
      type: object
      additionalProperties: false
      required:
      - clientId
      - firstName
      - lastName
      - email
      - phone
      properties:
        clientId:
          $ref: '#/components/schemas/Id'
        firstName:
          $ref: '#/components/schemas/NonEmptyString'
        lastName:
          $ref: '#/components/schemas/NonEmptyString'
        email:
          $ref: '#/components/schemas/Email'
        phone:
          $ref: '#/components/schemas/NonEmptyString'
    RegistrationRequest:
      type: object
      additionalProperties: false
      required:
      - firstName
      - lastName
      - email
      - phone
      - password
      properties:
        firstName:
          $ref: '#/components/schemas/NonEmptyString'
        lastName:
          $ref: '#/components/schemas/NonEmptyString'
        email:
          $ref: '#/components/schemas/Email'
        phone:
          $ref: '#/components/schemas/NonEmptyString'
        password:
          $ref: '#/components/schemas/NewPassword'
    RegistrationResponse:
      type: object
      additionalProperties: false
      required:
      - profile
      - role
      properties:
        profile:
          $ref: '#/components/schemas/Profile'
        role:
          type: string
          const: client
    ProfilePatch:
      type: object
      additionalProperties: false
      required: []
      properties:
        firstName:
          $ref: '#/components/schemas/NonEmptyString'
        lastName:
          $ref: '#/components/schemas/NonEmptyString'
        phone:
          $ref: '#/components/schemas/NonEmptyString'
      minProperties: 1
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          writeOnly: true
          description: Без обрізання чи зміни; мінімум 8 застосовується при встановленні нового пароля, а не замість
            перевірки входу.
    LoginResponse:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - tokenType
      - accountId
      - role
      properties:
        accessToken:
          $ref: '#/components/schemas/Token'
        tokenType:
          type: string
          const: Bearer
        accountId:
          $ref: '#/components/schemas/Id'
        role:
          $ref: '#/components/schemas/AccountRole'
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          writeOnly: true
          description: Поточний пароль без обрізання; відповідність перевіряє сервер.
        newPassword:
          $ref: '#/components/schemas/NewPassword'
    PublicCar:
      type: object
      additionalProperties: false
      required:
      - id
      - characteristics
      - dailyRate
      - currency
      properties:
        id:
          $ref: '#/components/schemas/Id'
        characteristics:
          $ref: '#/components/schemas/Characteristics'
        dailyRate:
          $ref: '#/components/schemas/DailyRate'
        currency:
          $ref: '#/components/schemas/Currency'
    AdminCar:
      type: object
      additionalProperties: false
      required:
      - id
      - characteristics
      - dailyRate
      - currency
      - hidden
      - futureBookingsCount
      properties:
        id:
          $ref: '#/components/schemas/Id'
        characteristics:
          $ref: '#/components/schemas/Characteristics'
        dailyRate:
          $ref: '#/components/schemas/DailyRate'
        currency:
          $ref: '#/components/schemas/Currency'
        hidden:
          type: boolean
        futureBookingsCount:
          $ref: '#/components/schemas/FutureBookingsCount'
      description: >-
        Лише А: лічильник підтверджених бронювань з початком строго після поточного серверного часу; скасовані,
        активні та завершені не враховуються. Поле лише для читання.
    CarCreateRequest:
      type: object
      additionalProperties: false
      required:
      - characteristics
      - dailyRate
      properties:
        characteristics:
          $ref: '#/components/schemas/Characteristics'
        dailyRate:
          $ref: '#/components/schemas/DailyRate'
        hidden:
          type: boolean
          default: false
    CarPatch:
      type: object
      additionalProperties: false
      required: []
      properties:
        characteristics:
          $ref: '#/components/schemas/Characteristics'
        dailyRate:
          $ref: '#/components/schemas/DailyRate'
        hidden:
          type: boolean
      minProperties: 1
    CarWarning:
      type: object
      additionalProperties: false
      required:
      - code
      - futureBookingsCount
      properties:
        code:
          type: string
          const: FUTURE_BOOKINGS_EXIST
        futureBookingsCount:
          type: integer
          minimum: 1
    CarPatchResponse:
      type: object
      additionalProperties: false
      required:
      - car
      - warnings
      properties:
        car:
          $ref: '#/components/schemas/AdminCar'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/CarWarning'
    CatalogQuery:
      type: object
      additionalProperties: false
      required: []
      properties:
        startsAt:
          $ref: '#/components/schemas/LocalHour'
        endsAt:
          $ref: '#/components/schemas/LocalHour'
      dependentRequired:
        startsAt:
        - endsAt
        endsAt:
        - startsAt
    AvailabilityQuery:
      type: object
      additionalProperties: false
      required:
      - startsAt
      - endsAt
      properties:
        startsAt:
          $ref: '#/components/schemas/LocalHour'
        endsAt:
          $ref: '#/components/schemas/LocalHour'
    AvailabilityResponse:
      type: object
      additionalProperties: false
      required:
      - carId
      - startsAt
      - endsAt
      - timezone
      - available
      properties:
        carId:
          $ref: '#/components/schemas/Id'
        startsAt:
          $ref: '#/components/schemas/LocalHour'
        endsAt:
          $ref: '#/components/schemas/LocalHour'
        timezone:
          $ref: '#/components/schemas/Timezone'
        available:
          type: boolean
    QuoteRequest:
      type: object
      additionalProperties: false
      required:
      - carId
      - startsAt
      - endsAt
      properties:
        carId:
          $ref: '#/components/schemas/Id'
        startsAt:
          $ref: '#/components/schemas/LocalHour'
        endsAt:
          $ref: '#/components/schemas/LocalHour'
    Quote:
      type: object
      additionalProperties: false
      required:
      - carId
      - startsAt
      - endsAt
      - timezone
      - dailyRate
      - billableDays
      - totalPrice
      - currency
      - priceConfirmationToken
      properties:
        carId:
          $ref: '#/components/schemas/Id'
        startsAt:
          $ref: '#/components/schemas/LocalHour'
        endsAt:
          $ref: '#/components/schemas/LocalHour'
        timezone:
          $ref: '#/components/schemas/Timezone'
        dailyRate:
          $ref: '#/components/schemas/DailyRate'
        billableDays:
          $ref: '#/components/schemas/BillableDays'
        totalPrice:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/Currency'
        priceConfirmationToken:
          $ref: '#/components/schemas/Token'
    BookingCreateRequest:
      type: object
      additionalProperties: false
      required:
      - carId
      - startsAt
      - endsAt
      - priceConfirmationToken
      properties:
        carId:
          $ref: '#/components/schemas/Id'
        startsAt:
          $ref: '#/components/schemas/LocalHour'
        endsAt:
          $ref: '#/components/schemas/LocalHour'
        priceConfirmationToken:
          $ref: '#/components/schemas/Token'
    BookingCar:
      type: object
      additionalProperties: false
      required:
      - id
      - characteristics
      properties:
        id:
          $ref: '#/components/schemas/Id'
        characteristics:
          $ref: '#/components/schemas/Characteristics'
    ClientCancellation:
      type: object
      additionalProperties: false
      required:
      - cancelledAt
      - authorRole
      - reason
      properties:
        cancelledAt:
          $ref: '#/components/schemas/EventTime'
        authorRole:
          $ref: '#/components/schemas/AccountRole'
        reason:
          oneOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - type: 'null'
      allOf:
      - if:
          properties:
            authorRole:
              const: client
          required:
          - authorRole
        then:
          properties:
            reason:
              type: 'null'
        else:
          properties:
            reason:
              $ref: '#/components/schemas/NonEmptyString'
      description: >-
        Проєкція для клієнта. Автор може бути клієнтом (reason=null) або адміністратором (непорожня причина). authorAccountId
        та особисті дані адміністратора заборонені.
    AdminCancellation:
      type: object
      additionalProperties: false
      required:
      - cancelledAt
      - authorRole
      - reason
      - authorAccountId
      properties:
        cancelledAt:
          $ref: '#/components/schemas/EventTime'
        authorRole:
          $ref: '#/components/schemas/AccountRole'
        reason:
          oneOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - type: 'null'
        authorAccountId:
          $ref: '#/components/schemas/Id'
      allOf:
      - if:
          properties:
            authorRole:
              const: client
          required:
          - authorRole
        then:
          properties:
            reason:
              type: 'null'
        else:
          properties:
            reason:
              $ref: '#/components/schemas/NonEmptyString'
    ClientCancellationRequest:
      type: object
      additionalProperties: false
      required: []
      properties: {}
      description: Лише порожній об’єкт; клієнт також може не передавати тіло. reason не приймається.
    AdminCancellationRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          $ref: '#/components/schemas/NonEmptyString'
    ClientBooking:
      type: object
      additionalProperties: false
      required:
      - id
      - car
      - startsAt
      - endsAt
      - timezone
      - status
      - dailyRate
      - billableDays
      - totalPrice
      - currency
      - clientCancellationDeadline
      - cancellation
      properties:
        id:
          $ref: '#/components/schemas/Id'
        car:
          $ref: '#/components/schemas/BookingCar'
        startsAt:
          $ref: '#/components/schemas/LocalHour'
        endsAt:
          $ref: '#/components/schemas/LocalHour'
        timezone:
          $ref: '#/components/schemas/Timezone'
        status:
          $ref: '#/components/schemas/BookingStatus'
        dailyRate:
          $ref: '#/components/schemas/DailyRate'
        billableDays:
          $ref: '#/components/schemas/BillableDays'
        totalPrice:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/Currency'
        clientCancellationDeadline:
          $ref: '#/components/schemas/EventTime'
        cancellation:
          oneOf:
          - $ref: '#/components/schemas/ClientCancellation'
          - type: 'null'
      allOf:
      - if:
          properties:
            status:
              const: cancelled
          required:
          - status
        then:
          properties:
            cancellation:
              $ref: '#/components/schemas/ClientCancellation'
        else:
          properties:
            cancellation:
              type: 'null'
    AdminBooking:
      type: object
      additionalProperties: false
      required:
      - id
      - car
      - startsAt
      - endsAt
      - timezone
      - status
      - dailyRate
      - billableDays
      - totalPrice
      - currency
      - clientCancellationDeadline
      - cancellation
      - client
      properties:
        id:
          $ref: '#/components/schemas/Id'
        car:
          $ref: '#/components/schemas/BookingCar'
        startsAt:
          $ref: '#/components/schemas/LocalHour'
        endsAt:
          $ref: '#/components/schemas/LocalHour'
        timezone:
          $ref: '#/components/schemas/Timezone'
        status:
          $ref: '#/components/schemas/BookingStatus'
        dailyRate:
          $ref: '#/components/schemas/DailyRate'
        billableDays:
          $ref: '#/components/schemas/BillableDays'
        totalPrice:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/Currency'
        clientCancellationDeadline:
          $ref: '#/components/schemas/EventTime'
        cancellation:
          oneOf:
          - $ref: '#/components/schemas/AdminCancellation'
          - type: 'null'
        client:
          $ref: '#/components/schemas/Profile'
      allOf:
      - if:
          properties:
            status:
              const: cancelled
          required:
          - status
        then:
          properties:
            cancellation:
              $ref: '#/components/schemas/AdminCancellation'
        else:
          properties:
            cancellation:
              type: 'null'
    ServicePeriod:
      type: object
      additionalProperties: false
      required:
      - id
      - carId
      - startsAt
      - endsAt
      - timezone
      - reason
      properties:
        id:
          $ref: '#/components/schemas/Id'
        carId:
          $ref: '#/components/schemas/Id'
        startsAt:
          $ref: '#/components/schemas/LocalHour'
        endsAt:
          $ref: '#/components/schemas/LocalHour'
        timezone:
          $ref: '#/components/schemas/Timezone'
        reason:
          $ref: '#/components/schemas/NonEmptyString'
    ServicePeriodCreateRequest:
      type: object
      additionalProperties: false
      required:
      - startsAt
      - endsAt
      - reason
      properties:
        startsAt:
          $ref: '#/components/schemas/LocalHour'
        endsAt:
          $ref: '#/components/schemas/LocalHour'
        reason:
          $ref: '#/components/schemas/NonEmptyString'
    ServicePeriodPatch:
      type: object
      additionalProperties: false
      required: []
      properties:
        startsAt:
          $ref: '#/components/schemas/LocalHour'
        endsAt:
          $ref: '#/components/schemas/LocalHour'
        reason:
          $ref: '#/components/schemas/NonEmptyString'
      minProperties: 1
    PublicCarList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicCar'
    AdminCarList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminCar'
    ClientBookingList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClientBooking'
    AdminBookingList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminBooking'
    ServicePeriodList:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServicePeriod'
    FieldError:
      type: object
      additionalProperties: false
      required:
      - field
      - message
      properties:
        field:
          $ref: '#/components/schemas/NonEmptyString'
        message:
          $ref: '#/components/schemas/NonEmptyString'
    ValidationDetails:
      type: object
      additionalProperties: false
      required:
      - fields
      properties:
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
          minItems: 1
    PriceChangedDetails:
      type: object
      additionalProperties: false
      required:
      - quote
      properties:
        quote:
          $ref: '#/components/schemas/Quote'
    ErrorDetails:
      oneOf:
      - type: object
        additionalProperties: false
        required: []
        properties: {}
      - $ref: '#/components/schemas/ValidationDetails'
      - $ref: '#/components/schemas/PriceChangedDetails'
      default: {}
    ApiError:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - details
      properties:
        code:
          type: string
          enum:
          - BAD_REQUEST
          - AUTHENTICATION_REQUIRED
          - FORBIDDEN
          - NOT_FOUND
          - METHOD_NOT_ALLOWED
          - INTERNAL_ERROR
          - SERVICE_UNAVAILABLE
          - EMAIL_ALREADY_EXISTS
          - INVALID_CREDENTIALS
          - LOGIN_BLOCKED
          - CAR_UNAVAILABLE
          - ALREADY_CANCELLED
          - CANCELLATION_DEADLINE_PASSED
          - BOOKING_NOT_CANCELLABLE
          - CAR_HAS_RELATED_RECORDS
          - SERVICE_PERIOD_CONFLICT
          - SERVICE_PERIOD_ALREADY_STARTED
          - VALIDATION_ERROR
          - PRICE_CHANGED
        message:
          $ref: '#/components/schemas/NonEmptyString'
        details:
          $ref: '#/components/schemas/ErrorDetails'
      allOf:
      - if:
          properties:
            code:
              const: VALIDATION_ERROR
          required:
          - code
        then:
          properties:
            details:
              $ref: '#/components/schemas/ValidationDetails'
      - if:
          properties:
            code:
              const: PRICE_CHANGED
          required:
          - code
        then:
          properties:
            details:
              $ref: '#/components/schemas/PriceChangedDetails'
      - if:
          properties:
            code:
              enum:
              - BAD_REQUEST
              - AUTHENTICATION_REQUIRED
              - FORBIDDEN
              - NOT_FOUND
              - METHOD_NOT_ALLOWED
              - INTERNAL_ERROR
              - SERVICE_UNAVAILABLE
              - EMAIL_ALREADY_EXISTS
              - INVALID_CREDENTIALS
              - LOGIN_BLOCKED
              - CAR_UNAVAILABLE
              - ALREADY_CANCELLED
              - CANCELLATION_DEADLINE_PASSED
              - BOOKING_NOT_CANCELLABLE
              - CAR_HAS_RELATED_RECORDS
              - SERVICE_PERIOD_CONFLICT
              - SERVICE_PERIOD_ALREADY_STARTED
          required:
          - code
        then:
          properties:
            details:
              type: object
              additionalProperties: false
              required: []
              properties: {}
      - if:
          properties:
            code:
              const: NOT_FOUND
          required:
          - code
        then:
          properties:
            message:
              const: Ресурс не знайдено.
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
  responses:
    BadRequest:
      description: '400: некоректний JSON або синтаксис URI/query.'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - BAD_REQUEST
          examples:
            BAD_REQUEST:
              $ref: '#/components/examples/BAD_REQUEST'
    Unauthorized:
      description: '401: відсутня або недійсна Bearer-автентифікація захищеної операції.'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - AUTHENTICATION_REQUIRED
          examples:
            AUTHENTICATION_REQUIRED:
              $ref: '#/components/examples/AUTHENTICATION_REQUIRED'
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWW-Authenticate'
    Forbidden:
      description: '403: автентифікована роль не має права на операцію.'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - FORBIDDEN
          examples:
            FORBIDDEN:
              $ref: '#/components/examples/FORBIDDEN'
    NotFound:
      description: >-
        404: ресурс відсутній або недоступний. Для чужого й відсутнього бронювання повністю однакове тіло: NOT_FOUND,
        Ресурс не знайдено., details={}.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - NOT_FOUND
          examples:
            NOT_FOUND:
              $ref: '#/components/examples/NOT_FOUND'
    MethodNotAllowed:
      description: '405: метод не підтримується відомим URI; Allow визначається маршрутом.'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - METHOD_NOT_ALLOWED
          examples:
            METHOD_NOT_ALLOWED:
              $ref: '#/components/examples/METHOD_NOT_ALLOWED'
      headers:
        Allow:
          $ref: '#/components/headers/Allow'
    InternalError:
      description: '500: внутрішня помилка без технічних подробиць.'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - INTERNAL_ERROR
          examples:
            INTERNAL_ERROR:
              $ref: '#/components/examples/INTERNAL_ERROR'
    ServiceUnavailable:
      description: '503: тимчасова недоступність без технічних подробиць.'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - SERVICE_UNAVAILABLE
          examples:
            SERVICE_UNAVAILABLE:
              $ref: '#/components/examples/SERVICE_UNAVAILABLE'
    EmailConflict:
      description: '409: нормалізована пошта зайнята, без даних чужого облікового запису.'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - EMAIL_ALREADY_EXISTS
          examples:
            EMAIL_ALREADY_EXISTS:
              $ref: '#/components/examples/EMAIL_ALREADY_EXISTS'
    InvalidCredentials:
      description: '401: невірна пошта або пароль; це не Bearer-помилка, WWW-Authenticate: Bearer не додається.'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - INVALID_CREDENTIALS
          examples:
            INVALID_CREDENTIALS:
              $ref: '#/components/examples/INVALID_CREDENTIALS'
    LoginBlocked:
      description: '429: п’ята невдала спроба або чинне 15-хвилинне блокування. Повторні спроби не подовжують межу.'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - LOGIN_BLOCKED
          examples:
            LOGIN_BLOCKED:
              $ref: '#/components/examples/LOGIN_BLOCKED'
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
    ValidationError:
      description: >-
        422: відсутні, невідомі чи недопустимі поля або порушення погоджених правил. details.fields обов’язковий;
        значення полів не відображаються.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - VALIDATION_ERROR
          examples:
            VALIDATION_ERROR:
              $ref: '#/components/examples/VALIDATION_ERROR'
    CarUnavailable:
      description: '409: приховування або недоступність авто на період; без причин, чужих даних чи деталей конфлікту.'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - CAR_UNAVAILABLE
          examples:
            CAR_UNAVAILABLE:
              $ref: '#/components/examples/CAR_UNAVAILABLE'
    CarRelatedRecords:
      description: '409: будь-яке пов’язане бронювання чи службовий період, включно з історичними.'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - CAR_HAS_RELATED_RECORDS
          examples:
            CAR_HAS_RELATED_RECORDS:
              $ref: '#/components/examples/CAR_HAS_RELATED_RECORDS'
    ServiceConflict:
      description: '409: перетин із підтвердженим/активним бронюванням або іншим службовим періодом; без їх ідентифікаторів
        і службових причин.'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - SERVICE_PERIOD_CONFLICT
          examples:
            SERVICE_PERIOD_CONFLICT:
              $ref: '#/components/examples/SERVICE_PERIOD_CONFLICT'
    ServiceStarted:
      description: '409: чинний службовий період уже почався; історія незмінна.'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - SERVICE_PERIOD_ALREADY_STARTED
          examples:
            SERVICE_PERIOD_ALREADY_STARTED:
              $ref: '#/components/examples/SERVICE_PERIOD_ALREADY_STARTED'
    BookingConflict:
      description: >-
        409: авто недоступне або тариф змінився; для PRICE_CHANGED details.quote містить повний оновлений Quote
        і новий priceConfirmationToken, без створення бронювання.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - CAR_UNAVAILABLE
                      - PRICE_CHANGED
          examples:
            CAR_UNAVAILABLE:
              $ref: '#/components/examples/CAR_UNAVAILABLE'
            PRICE_CHANGED:
              $ref: '#/components/examples/PRICE_CHANGED'
    CancellationConflict:
      description: '409: вже скасовано; підтверджене бронювання після клієнтської межі; або початок уже настав.
        Новий запис скасування не створюється.'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - ALREADY_CANCELLED
                      - CANCELLATION_DEADLINE_PASSED
                      - BOOKING_NOT_CANCELLABLE
          examples:
            ALREADY_CANCELLED:
              $ref: '#/components/examples/ALREADY_CANCELLED'
            CANCELLATION_DEADLINE_PASSED:
              $ref: '#/components/examples/CANCELLATION_DEADLINE_PASSED'
            BOOKING_NOT_CANCELLABLE:
              $ref: '#/components/examples/BOOKING_NOT_CANCELLABLE'
    ServiceUpdateConflict:
      description: '409: перетин або чинний службовий період уже почався; бронювання автоматично не скасовуються.'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorResponse'
            - properties:
                error:
                  properties:
                    code:
                      enum:
                      - SERVICE_PERIOD_CONFLICT
                      - SERVICE_PERIOD_ALREADY_STARTED
          examples:
            SERVICE_PERIOD_CONFLICT:
              $ref: '#/components/examples/SERVICE_PERIOD_CONFLICT'
            SERVICE_PERIOD_ALREADY_STARTED:
              $ref: '#/components/examples/SERVICE_PERIOD_ALREADY_STARTED'
    Catalog:
      description: >-
        200: неприховані авто; А отримує адміністративну проєкцію. За періодом — лише доступні; без періоду доступність
        не стверджується. anyOf дозволяє спільний порожній список; вибір проєкції за роллю перевіряє сервер.
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/PublicCarList'
            - $ref: '#/components/schemas/AdminCarList'
          examples:
            PublicCarList:
              $ref: '#/components/examples/PublicCarList'
            AdminCarList:
              $ref: '#/components/examples/AdminCarList'
    Car:
      description: '200: публічна або адміністративна проєкція за чинною роллю.'
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/PublicCar'
            - $ref: '#/components/schemas/AdminCar'
          examples:
            PublicCar:
              $ref: '#/components/examples/PublicCar'
            AdminCar:
              $ref: '#/components/examples/AdminCar'
            AdminCarHidden:
              $ref: '#/components/examples/AdminCarHidden'
    Availability:
      description: '200: результат на весь період; false також для відомого прихованого авто, без подробиць.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AvailabilityResponse'
          examples:
            AvailabilityTrue:
              $ref: '#/components/examples/AvailabilityTrue'
            AvailabilityFalse:
              $ref: '#/components/examples/AvailabilityFalse'
    RegisteredClient:
      description: '201: створений клієнт, без Location та автоматичного входу.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegistrationResponse'
          examples:
            RegistrationResponse:
              $ref: '#/components/examples/RegistrationResponse'
    SessionCreated:
      description: '201: вхід відповідної ролі; строк сесії не визначено.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LoginResponse'
          examples:
            LoginClient:
              $ref: '#/components/examples/LoginClient'
            LoginAdmin:
              $ref: '#/components/examples/LoginAdmin'
    Profile:
      description: '200: власний актуальний профіль.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Profile'
          examples:
            Profile:
              $ref: '#/components/examples/Profile'
    Quote:
      description: '200: попередня вартість; не створює бронювання та не резервує авто.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Quote'
          examples:
            Quote:
              $ref: '#/components/examples/Quote'
    BookingCreated:
      description: '201: атомарно створене підтверджене бронювання; Location: /api/v1/bookings/{id}.'
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ClientBooking'
            - properties:
                status:
                  const: confirmed
          examples:
            ClientBooking:
              $ref: '#/components/examples/ClientBooking'
      headers:
        Location:
          description: URI створеного бронювання; конкретний статичний приклад для mock.
          required: true
          schema:
            type: string
            format: uri-reference
          example: /api/v1/bookings/booking-example
    Bookings:
      description: '200: К — власні записи; А — усі з актуальними контактами. anyOf дозволяє спільний порожній список;
        роль перевіряє сервер.'
      content:
        application/json:
          schema:
            anyOf:
            - $ref: '#/components/schemas/ClientBookingList'
            - $ref: '#/components/schemas/AdminBookingList'
          examples:
            ClientBookingList:
              $ref: '#/components/examples/ClientBookingList'
            AdminBookingList:
              $ref: '#/components/examples/AdminBookingList'
    Booking:
      description: '200: проєкція за роллю; К не отримує чужих бронювань чи особистих даних автора-адміністратора.'
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/ClientBooking'
            - $ref: '#/components/schemas/AdminBooking'
          examples:
            ClientBooking:
              $ref: '#/components/examples/ClientBooking'
            AdminBooking:
              $ref: '#/components/examples/AdminBooking'
            ClientBookingCancelled:
              $ref: '#/components/examples/ClientBookingCancelled'
            AdminBookingCancelled:
              $ref: '#/components/examples/AdminBookingCancelled'
            ClientBookingActive:
              $ref: '#/components/examples/ClientBookingActive'
            ClientBookingCompleted:
              $ref: '#/components/examples/ClientBookingCompleted'
    CancellationCreated:
      description: >-
        201: запис скасування; стан cancelled і період звільнено. А отримує authorAccountId; К — ні. Location: /api/v1/bookings/{bookingId}/cancellation;
        читання — всередині бронювання.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/ClientCancellation'
            - $ref: '#/components/schemas/AdminCancellation'
          examples:
            ClientCancellation:
              $ref: '#/components/examples/ClientCancellation'
            AdminCancellation:
              $ref: '#/components/examples/AdminCancellation'
            ClientCancellationAtDeadline:
              $ref: '#/components/examples/ClientCancellationAtDeadline'
      headers:
        Location:
          description: URI скасування запитаного бронювання; приклад спільний для обох ролей.
          required: true
          schema:
            type: string
            format: uri-reference
          example: /api/v1/bookings/booking-example/cancellation
    AdminCars:
      description: '200: усі авто, включно з прихованими; лише А.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminCarList'
          examples:
            AdminCarList:
              $ref: '#/components/examples/AdminCarList'
            AdminCarListWithHidden:
              $ref: '#/components/examples/AdminCarListWithHidden'
    CarCreated:
      description: '201: створений автомобіль; Location: /api/v1/cars/{id}.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AdminCar'
          examples:
            CreatedCar:
              $ref: '#/components/examples/CreatedCar'
      headers:
        Location:
          description: URI створеного автомобіля; конкретний статичний приклад для mock.
          required: true
          schema:
            type: string
            format: uri-reference
          example: /api/v1/cars/car-example
    CarUpdated:
      description: '200: оновлене авто й warnings; попередження не блокує приховування.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CarPatchResponse'
          examples:
            CarPatchResponse:
              $ref: '#/components/examples/CarPatchResponse'
            CarDetailsUpdated:
              $ref: '#/components/examples/CarDetailsUpdated'
            CarRestored:
              $ref: '#/components/examples/CarRestored'
    ServicePeriods:
      description: '200: майбутні й історичні службові періоди; лише А.'
      content:
